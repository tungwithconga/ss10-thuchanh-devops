name: Spring Boot CI Pipeline

# ─────────────────────────────────────────────────────────────
#  Trigger: push / PR vào main hoặc develop
# ─────────────────────────────────────────────────────────────
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ═══════════════════════════════════════════════════════════
  #  JOB 1 – Kiểm tra cú pháp & compile
  # ═══════════════════════════════════════════════════════════
  syntax-check:
    name: "✅ Syntax Check (Compile)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Compile main sources – phát hiện lỗi cú pháp Java
      - name: Compile main sources
        run: ./gradlew compileJava --no-daemon

      # Compile test sources – đảm bảo test code cũng hợp lệ
      - name: Compile test sources
        run: ./gradlew compileTestJava --no-daemon

  # ═══════════════════════════════════════════════════════════
  #  JOB 2 – Chạy Unit Tests + Coverage Report
  # ═══════════════════════════════════════════════════════════
  test:
    name: "🧪 Unit Tests & Coverage"
    runs-on: ubuntu-latest
    needs: syntax-check            # chỉ chạy nếu compile thành công

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Chạy toàn bộ unit tests, sau đó sinh báo cáo JaCoCo
      - name: Run unit tests with JaCoCo coverage
        run: ./gradlew test jacocoTestReport --no-daemon

      # Upload báo cáo test HTML để xem trực tiếp trên GitHub
      - name: Upload test report
        if: always()               # luôn upload kể cả khi test fail
        uses: actions/upload-artifact@v4
        with:
          name: test-report-html
          path: build/reports/tests/test/
          retention-days: 7

      # Upload báo cáo coverage JaCoCo
      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: build/reports/jacoco/test/html/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════
  #  JOB 3 – Build & Package JAR
  # ═══════════════════════════════════════════════════════════
  build:
    name: "📦 Build & Package JAR"
    runs-on: ubuntu-latest
    needs: test                    # chỉ build nếu test pass

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Build Spring Boot executable JAR (bỏ qua test vì đã chạy ở job trước)
      - name: Package Spring Boot JAR
        run: ./gradlew bootJar -x test --no-daemon

      # Upload JAR artifact để có thể download từ GitHub Actions
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: springboot-api-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
